[project]
name = "cli-ascii-portrait"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "valecarlos", email = "carlos_valencia@live.com" }
]
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "typer>=0.29.2",
]

[project.scripts]
cli-ascii-portrait = "cli_ascii_portrait:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
